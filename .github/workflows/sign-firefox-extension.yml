name: Build & Sign Firefox Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build extension zip
        run: |
          zip -r extension-${{ steps.version.outputs.version }}.zip \
            manifest.json \
            src/

      - name: Sign extension with AMO
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          web-ext sign \
            --source-dir . \
            --artifacts-dir ./signed \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel listed

      - name: Upload unsigned zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-unsigned-${{ steps.version.outputs.version }}
          path: extension-${{ steps.version.outputs.version }}.zip

      - name: Upload signed extension as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-signed-${{ steps.version.outputs.version }}
          path: signed/*.xpi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension-${{ steps.version.outputs.version }}.zip
            signed/*.xpi